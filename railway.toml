[build]
builder = "nixpacks"
buildCommand = "npm install -g pnpm@9 && export PATH=$(npm config get prefix)/bin:$PATH && pnpm install --no-frozen-lockfile && pnpm --filter @workspace/api-server run build"

[deploy]
startCommand = "node --enable-source-maps artifacts/api-server/dist/index.mjs"
healthcheckPath = "/api/healthz"
healthcheckTimeout = 30
restartPolicyType = "always"
